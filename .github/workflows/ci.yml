name: lx-source CI

on:
  push:
    branches: [master, main]
    paths:
      - 'lx-source.js'
      - 'test/**'
      - 'scripts/**'
      - '.github/workflows/**'
  schedule:
    # v2.0：每日端点巡检，自动刷新健康表并写回仓库（UTC 06:00 ≈ 北京时间 14:00）
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # 手动触发
  # v4.0：发版后自动巡检，生成发布后基线健康表（含近7日成功率 + 死源建议）
  release:
    types: [published]

jobs:
  # ---------- v2.0：语法 + 冒烟测试 ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: L0 语法检查
        run: node --check lx-source.js
      - name: L1 冒烟测试（mock lx 宿主，32 组用例）
        run: node test/lx-source-smoke-test.js
      - name: L1.1 candidate-audit 专项测试（v8.1）
        run: node test/candidate-audit-test.js
      # v5.0：发布前自检门——版本串同步/actions声明/README与ROADMAP同步，任一失败阻断
      - name: L2 发布前自检门（版本串/action声明/文档同步）
        run: node scripts/self-check.js
      - name: 巡检脚本语法
        run: node --check scripts/probe.js

  # ---------- v2.0：每日端点巡检 + 健康表写回 ----------
  probe:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 判否候选恢复探测（hyw/huanyin 触发式待办自动监控）
        run: node scripts/recheck-candidates.js || true
      - name: 端点巡检（Range 判定）
        # 存在失败端点时脚本 exit 2（信号），用 || true 不阻断写回——健康表需要记录失败状态
        run: node scripts/probe.js || true
      - name: v8.0 健康日报生成（基于 probe-history 聚合）
        run: node scripts/health-daily.js || true
      - name: 健康表写回（自动提交）
        run: |
          git config user.name 'luanmuc[bot]'
          git config user.email 'luanmuc@users.noreply.github.com'
          git add README_HEALTH.md docs/probe-history.jsonl docs/health-daily/ docs/candidate-status.md
          git commit -m "chore(probe): 每日端点巡检刷新健康表+历史记录+v8.0健康日报 [自动]" -q || echo "健康表无变化，跳过提交"
          git push origin HEAD:${GITHUB_REF_NAME} || echo "push 失败（无权限/冲突时忽略，巡检产物仍在 Actions 日志）"

  # ---------- v7.0：每周生态扫描（pdone 健康表交叉，产出新候选/失效清单）----------
  ecosystem:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # 每周一 UTC 08:00（北京时间 16:00）跑一次生态扫描
    # 注意：schedule 的每周触发和上面每日 probe 共用同一个 cron，这里用 if 区分只在周一跑
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 生态扫描（pdone 健康表交叉）
        run: node scripts/ecosystem-scan.js || echo "生态扫描失败（网络/pdone 不可达时忽略）"
